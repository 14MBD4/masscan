name: Build Masscan Windows EXE
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup MSVC Compiler
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Masscan with Official VS Project
        shell: cmd
        run: |
          msbuild vs10\masscan.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0

      - name: Upload Masscan EXE
        uses: actions/upload-artifact@v5
        with:
          name: masscan-windows-x64
          path: bin\masscan.exe
