name: Build Masscan Windows EXE
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build Masscan (x64) with MinGW GCC
        run: |
          gcc --version
          mingw32-make -j4

      - name: Upload Masscan EXE
        uses: actions/upload-artifact@v5
        with:
          name: masscan-windows-x64
          path: bin/masscan.exe
