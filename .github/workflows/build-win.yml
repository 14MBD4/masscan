name: Build Masscan Windows EXE
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build Masscan with MinGW GCC
        shell: msys2 {0}
        run: |
          pacman -S --noconfirm --needed mingw-w64-x86_64-gcc make
          mingw32-make -j4

      - name: Upload Masscan EXE
        uses: actions/upload-artifact@v5
        with:
          name: masscan-windows-x64
          path: bin/masscan.exe
